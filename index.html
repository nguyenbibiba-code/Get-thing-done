<!DOCTYPE html>
<html lang="vi">
<head>

<title>Get Thing Done</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e0e10"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Get Thing Done"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">

<style>
:root{color-scheme:dark;--bg:#0e0e10;--s1:#17171a;--s2:#222227;--line:#2a2a30;--ink:#f3f3f4;--mute:#8d8d95;--pink:#ff4d9d;--pinkd:#ff4d9d26;--r:8px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Segoe UI",Inter,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--pink)}
#top{display:flex;align-items:center;gap:2px;padding:14px 16px 2px}
#top h1{font-size:26px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ib{width:34px;height:34px;border-radius:8px;color:var(--mute);font-size:20px}
.ib:active{background:var(--s2)}
#sub{padding:0 16px 8px;color:var(--mute);font-size:15px}
#main{flex:1;overflow:auto;padding:0 8px 120px}
#bar{display:flex;gap:2px;overflow-x:auto;background:var(--bg);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.tab{flex:0 0 auto;padding:9px 13px;border-radius:8px;font-size:16px;color:var(--mute);white-space:nowrap}
.tab.on{color:var(--ink);background:var(--s2);font-weight:600}
.tab.on:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-right:7px;vertical-align:middle}
#fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%;background:var(--pink);color:#111;font-size:28px;font-weight:300;box-shadow:0 4px 18px #ff4d9d55}
.gh{display:flex;align-items:center;gap:8px;margin:18px 8px 4px;font-size:15px;font-weight:600;color:var(--mute)}
.gh .n{font-weight:400;opacity:.7}
.pbar{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;width:70px}
.pbar i{display:block;height:100%;background:var(--pink)}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-bottom:1px solid var(--line)}
.row:active{background:var(--s1)}
.ck{flex:0 0 20px;height:20px;border-radius:5px;border:1.5px solid #55555e;margin-top:2px;display:grid;place-items:center;color:#111;font-size:15px;font-weight:700}
.ck.done{background:var(--pink);border-color:var(--pink)}
.rb{flex:1;min-width:0}
.tt{font-weight:500;word-break:break-word}
.tt.dn{text-decoration:line-through;color:var(--mute)}
.tt .st{color:var(--pink);margin-right:4px}
.par{font-size:14px;color:var(--mute);margin-top:1px}
.mt{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;align-items:center;font-size:14px;color:var(--mute)}
.pill{display:inline-block;font-size:14px;padding:1px 8px;border-radius:5px;background:var(--s2);color:#d4d4d8;white-space:nowrap}
.pill.late{background:var(--pinkd);color:var(--pink)}
.pill.doing{background:var(--pink);color:#111}
.pill.done{color:var(--mute)}
.pill.due{background:none;padding:0;color:var(--mute)}
.pill.due.late{color:var(--pink);background:none}
.pill.due.soon{color:#ffb3d6}
.empty{text-align:center;color:var(--mute);padding:50px 20px}
.newrow{display:block;width:100%;text-align:left;padding:10px 8px;color:var(--mute)}
.newrow:active{background:var(--s1)}
.board{display:flex;gap:12px;overflow-x:auto;padding:0 4px 10px;align-items:flex-start}
.col{flex:0 0 76%;max-width:290px}
.col .gh{margin:6px 4px}
.col .row{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;padding:9px 10px}
.mv{font-size:17px;color:var(--mute);padding:0 4px}
.tbl{overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;font-size:16px;min-width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle;max-width:220px;overflow:hidden;text-overflow:ellipsis}
th{font-size:14px;color:var(--mute);font-weight:500}
td:first-child,th:first-child{position:sticky;left:0;background:var(--bg);max-width:160px;border-right:1px solid var(--line)}
td[data-cell]:active{background:var(--s1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{font-size:13px;color:var(--mute);text-align:center;padding:4px 0}
.cd{min-height:50px;border-radius:8px;padding:4px 2px;font-size:15px;text-align:center;color:var(--ink)}
.cd.td{background:var(--pinkd);color:var(--pink);font-weight:700}
.cd.sel{outline:1.5px solid var(--pink)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--pink);margin:1px}
.dot.d{background:#fff}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 4px}
.mx>div{background:var(--s1);border-radius:var(--r);padding:8px;min-height:120px}
.mx h4{margin:0 0 4px;font-size:14px;color:var(--mute)}
#ov,#pop{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
#pop{z-index:40;background:#0008}
#ov.on,#pop.on{display:flex}
#sheet{background:var(--bg);width:100%;height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px 18px calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.pbox{background:var(--s1);width:100%;max-height:70vh;overflow:auto;border-radius:16px 16px 0 0;padding:8px 8px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.ph2{padding:8px 10px;font-size:14px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.po{padding:12px 10px;border-radius:8px;display:flex;justify-content:space-between}
.po:active{background:var(--s2)}
.po.on{color:var(--pink)}
.po.on:after{content:"✓"}
.po.mut{color:var(--mute)}
.pin{margin:6px 0}
.pgtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pgtop button{color:var(--mute);padding:6px 4px}
.ttlw{display:flex;gap:8px;align-items:center;margin:6px 0 14px}
input.ttl{font-size:26px;font-weight:700;border:0;background:none;padding:0;width:100%;outline:none;letter-spacing:-.01em}
input.ico{width:46px;font-size:26px;text-align:center;border:0;background:var(--s1);border-radius:8px;padding:2px;outline:none}
.pr{display:flex;align-items:flex-start;gap:8px;min-height:36px;padding:6px 4px;border-radius:6px;cursor:pointer}
.pr:active{background:var(--s1)}
.pl{flex:0 0 96px;color:var(--mute);font-size:16px;padding-top:2px}
.pv{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.ph{color:#5d5d66}
.pv input{border:0;background:none;outline:none;width:100%;padding:2px 0}
.more{color:var(--mute);padding:8px 4px;display:block;font-size:16px}
.sec{margin:20px 0 4px;font-size:15px;font-weight:600;color:var(--mute)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--s1);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pink)}
textarea.body{border:0;background:none;padding:6px 4px;min-height:120px;font-size:17px}
.sub input{border:0;background:none;padding:9px 8px}
.two{display:flex;gap:8px;align-items:center}
.btn{padding:10px 16px;border-radius:8px;background:var(--pink);color:#111;font-weight:600}
.btn.g{background:var(--s2);color:var(--ink)}
.btn.r{background:none;color:var(--pink);border:1px solid var(--pinkd)}
.ba{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-block;font-size:15px;padding:3px 10px;border-radius:6px;background:var(--s2);color:#d4d4d8}
button.chip.on{background:var(--pink);color:#111}
.f{margin:16px 0 4px;font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.small{font-size:14px;color:var(--mute)}
#focus{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#focus.on{display:flex}
#focus .big{font-size:60px;font-variant-numeric:tabular-nums;color:var(--pink)}
#focus .nm{font-size:24px;font-weight:700}

html,body{height:100dvh;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
input,select,textarea{font-size:18px}
#sheet{height:94dvh}
.tab{min-height:40px}
.tab.rt{display:flex;align-items:center;gap:6px;padding:4px 6px}
.tab.rt button{padding:8px 10px;color:var(--pink);font-size:17px}

.calbar{padding:6px 8px 8px;position:sticky;left:0}
.calbar .cl{margin-left:6px;font-size:17px}
.tg{display:grid;min-width:100%;position:relative}
.gut{position:sticky;left:0;background:var(--bg);z-index:2;color:var(--mute);font-size:13px}
.tg .hd{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.dh{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 6px;font-size:14px;color:var(--mute);min-height:36px}

.dh.td b,.dh.td .mini{color:var(--pink)}
.dh.col{justify-content:center;flex-direction:column;padding:2px}
.dh button{color:var(--mute);padding:6px;font-size:16px}
.mini{font-size:14px;font-weight:700}
.al{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px;min-height:24px;font-size:13px}
.gut.al{border-left:0;display:flex;align-items:center;font-size:11px;line-height:1.1;padding:0 2px}
.ac{background:var(--s2);border-radius:4px;padding:2px 5px;margin-bottom:2px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac.dn{opacity:.5;text-decoration:line-through}
.ac.due{background:var(--pinkd);color:var(--pink)}
.hl{font-size:12px;color:var(--mute);text-align:center;padding-top:1px;border-top:1px solid var(--line)}
.dc{position:relative;border-left:1px solid var(--line)}
.dc.cl{background:repeating-linear-gradient(45deg,transparent 0 6px,#ffffff08 6px 12px)}
.hc{border-top:1px solid var(--line)}
.hc:active,.hcx:active{background:var(--pinkd)}
.blk{position:absolute;background:#ff4d9d30;border-left:3px solid var(--pink);border-radius:5px;padding:2px 5px;font-size:14px;line-height:1.25;overflow:hidden;cursor:pointer;z-index:1}
.blk small{display:block;color:var(--mute);font-size:12px}
.blk.done{background:var(--s2);border-left-color:#55555e;color:var(--mute);text-decoration:line-through}

.blk.doing{background:var(--pink);color:#111}
.blk.doing small{color:#111a}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--pink);z-index:3;pointer-events:none}
.nowh{position:absolute;top:0;bottom:0;width:2px;background:var(--pink);z-index:3;pointer-events:none}
.hg{min-width:100%}
.hrow{display:flex;border-bottom:1px solid var(--line)}
.hrow .hlab{flex:0 0 70px;border-right:1px solid var(--line)}
.hrow .hlab .dh{border:0;min-height:30px;flex-direction:row}
.hhead{position:sticky;top:0;z-index:5;background:var(--bg)}
.hhrs{display:flex;font-size:12px;color:var(--mute)}
.hhrs div{flex:0 0 auto;border-left:1px solid var(--line);padding:6px 3px}
.hb{position:relative}
.hcx{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.strip{position:absolute;left:0;top:2px;display:flex;gap:4px;z-index:1;padding:0 4px;max-width:100%;overflow:hidden}
.strip .ac{margin:0;flex:0 0 auto;max-width:150px}
.pn{display:flex;flex-direction:column;gap:6px;margin:2px 4px 8px}
.nc{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:8px;padding:8px 10px;font-size:15px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.newnote{text-align:left;color:var(--mute);font-size:15px;padding:2px 4px}
.nc2{background:var(--s1);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px}
.nc2 textarea{border:0;background:none;padding:6px}
.nb{display:flex;justify-content:flex-end;gap:14px;padding:2px 8px 4px}
.nb button{color:var(--pink);font-size:15px}
.nb button+button{color:var(--mute)}
.col .pn{margin:0 0 8px}

#splash{position:fixed;inset:0;background:#0e0e10;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
#splash .sn{font-size:30px;font-weight:800;letter-spacing:-.02em}
#splash .ss{font-size:16px;color:var(--mute)}
.lg{flex:0 0 26px;margin-right:8px}

.dg{touch-action:none;cursor:grab;color:var(--mute);padding:6px 8px 6px 0;user-select:none;-webkit-user-select:none;font-size:18px;letter-spacing:-2px}
.board .row,.vboard .row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drop{outline:2px solid var(--pink);outline-offset:-2px;background:var(--pinkd)}
.dragging{opacity:.65;outline:1.5px dashed var(--pink);border-radius:10px}
.tab.dragging{background:var(--pinkd);outline-offset:-2px}
body.dgn{user-select:none}
.cb{margin-left:auto;color:var(--mute);padding:2px 8px}
.col.cl{flex:0 0 140px}
.col.cl .gh{flex-wrap:wrap}
.vboard{padding:0 4px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 8px 10px;font-size:15px;color:var(--mute)}
.crumb button{padding:6px 11px;border-radius:8px;background:var(--s1);color:var(--ink);border:1px solid var(--line)}
.crumb button.on{border-color:var(--pink);color:var(--pink)}
.crumb .sep{opacity:.6}
.crumb .md{color:var(--pink);background:none}
.crumb .md{margin-left:auto}
.crumb .md~.md{margin-left:0}
.cb.dr{margin-left:0}
.addcol{display:inline-block;width:auto;padding:2px 14px;margin:2px 0 4px;font-size:17px;line-height:22px;border-radius:7px;background:var(--s2);color:var(--pink)}
.gh.two{flex-direction:column;align-items:stretch;gap:3px}
.gh .g1{display:flex;align-items:center;gap:8px;min-width:0}
.gh .gt{flex:1;min-width:0;cursor:pointer;color:var(--ink);overflow-wrap:anywhere}
.gh .g2{display:flex;align-items:center;gap:8px;padding-left:2px;font-size:14px}
.gh .g2 .pbar{flex:1;width:auto}
.vg{background:var(--s1);border-radius:10px;padding:4px 8px 8px;margin-bottom:10px}

.swb{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.swb .row{flex:0 0 240px;margin-bottom:0}
.vg.sw .pn{display:none}
</style>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const todayISO=()=>iso(new Date());
const fromISO=s=>new Date(s+'T00:00:00');
function addDays(s,n){const d=fromISO(s);d.setDate(d.getDate()+n);return iso(d)}
function endOfWeek(s){const d=fromISO(s);return addDays(s,(7-d.getDay())%7)}
function startOfWeek(s){return addDays(endOfWeek(s),-6)}
function endOfMonth(s){const d=fromISO(s);return iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const fmtD=s=>{const d=fromISO(s);return DOW[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PRI={now:'Làm được ngay',rand:'Làm ngẫu nhiên',slow:'Làm từ từ',save:'Để dành'};
const PRI_ORDER=['now','rand','slow','save'];
const STAT={idea:'Ý tưởng',doing:'Đang làm',late:'Đang trì hoãn',done:'Xong'};
const COLORS=['#e8a33d','#6aa57f','#5b8fd0','#c0699a','#9a7bd0','#e0875a','#4fb0b0'];

// Hạn / ngày làm: có thể chọn mốc ước lượng hoặc ngày cụ thể
function presetDate(k,n,unit){
  const t=todayISO();
  if(k==='today')return {iso:t,label:'Hôm nay'};
  if(k==='tmr')return {iso:addDays(t,1),label:'Ngày mai'};
  if(k==='week')return {iso:endOfWeek(t),label:'Tuần này'};
  if(k==='nweek')return {iso:addDays(endOfWeek(t),7),label:'Tuần sau'};
  if(k==='w2')return {iso:addDays(t,14),label:'2 tuần nữa'};
  if(k==='w3')return {iso:addDays(t,21),label:'3 tuần nữa'};
  if(k==='month')return {iso:endOfMonth(t),label:'Tháng này'};
  if(k==='rel'){const d=unit==='w'?n*7:n;return {iso:addDays(t,d),label:n+(unit==='w'?' tuần':' ngày')+' nữa'}}
  return null;
}
const PRESETS=[['today','Hôm nay'],['tmr','Mai'],['week','Tuần này'],['nweek','Tuần sau'],['w2','2 tuần nữa'],['w3','3 tuần nữa'],['month','Tháng này']];

function fmtEst(m){if(!m)return '';if(m>=480&&m%480===0)return (m/480)+' ngày';if(m>=60&&m%60===0)return (m/60)+'g';if(m>=60)return Math.floor(m/60)+'g'+(m%60)+'p';return m+'p'}
function countdown(due){
  if(!due)return null;
  const tg=new Date(due.iso+'T'+(due.time||'23:59')+':00');
  let ms=tg-new Date();const neg=ms<0;ms=Math.abs(ms);
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  const txt=d>0?d+'n '+h+'g':h>0?h+'g '+m+'p':m+'p';
  return {txt:(neg?'trễ ':'còn ')+txt,neg,soon:!neg&&ms<864e5*2};
}

// ----- Dữ liệu -----
let S=null;

async function load(){
  let loaded=null;
  try{
    const user=await claude.use('user'),db=await claude.use('db');
    if(user&&db){
      const id=await user.id();
      dbDoc=db.doc('data/users/'+id+'/app/state');
      const snap=await dbDoc.get();
      const data=snap&&(typeof snap.data==='function'?snap.data():snap);
      if(data&&data.json)loaded=JSON.parse(data.json);
    }
  }catch(e){}
  if(!loaded){try{const j=localStorage.getItem('motviec');if(j)loaded=JSON.parse(j)}catch(e){}}

  if(!S.views.find(v=>v.id===S.active))S.active=S.views[0].id;
}

// ----- Logic -----
const T=id=>S.tasks.find(t=>t.id===id);
const P=id=>S.projects.find(p=>p.id===id);
function eff(t){
  if(t.status==='done')return 'done';
  const td=todayISO();
  if(S.auto.delay&&t.work&&t.work.iso<td)return 'late';
  if(t.status==='doing')return 'doing';
  if(S.auto.doingToday&&t.work&&t.work.iso===td)return 'doing';
  return t.status;
}
function kids(id){return S.tasks.filter(t=>t.parent===id)}
function prog(t){const k=kids(t.id);if(!k.length)return null;return {d:k.filter(x=>x.status==='done').length,n:k.length}}
function descend(ids){
  const out=new Set(ids);let ch=true;
  while(ch){ch=false;S.projects.forEach(p=>{if(p.parent&&out.has(p.parent)&&!out.has(p.id)){out.add(p.id);ch=true}})}
  return out;
}
// ----- Dự án lớn / nhỏ: xem dạng "đi sâu" -----
function pkids(id){return S.projects.filter(p=>(p.parent||null)===(id||null))}
function projPath(id){const a=[];let p=P(id),n=0;while(p&&n++<20){a.unshift(p);p=p.parent?P(p.parent):null}return a}
function pfocus(v){return v.pf&&P(v.pf)?v.pf:null}
// cách chia cột của board Dự án: auto | proj | tag | pri | status | moc | cp:<id>
function pmodeList(){return [['auto','Tự động (dự án nhỏ, hết thì tag)'],['proj','Dự án nhỏ'],['tag','Tag'],['pri','Ưu tiên'],['status','Trạng thái'],['moc','Mốc làm']].concat(S.props.filter(p=>p.type==='select').map(p=>['cp:'+p.id,p.name]))}
function pmodeEff(v){
  const f=pfocus(v),m=v.pmode||'auto';
  if(m!=='auto'&&(m.indexOf('cp:')!==0||S.props.find(p=>p.id===m.slice(3))))return m;
  return (f&&!pkids(f).length)?'tag':'proj';
}
function colGroup(v){
  const g=v.group==='none'?'status':v.group;
  if(g==='project'&&v.mode==='board'){const m=pmodeEff(v);return m==='proj'?'project':m}
  return g;
}
function hiddenOpen(pid){const set=descend([pid]);return S.tasks.filter(t=>t.status!=='done'&&t.projects.some(x=>set.has(x))).length}
function projCols(v,ts){
  const f=pfocus(v),ks=pkids(f),m=pmodeEff(v);
  const inSet=f?descend([f]):null;
  const base=inSet?ts.filter(t=>t.projects.some(x=>inSet.has(x))):ts;
  if(m!=='proj'){
    let cols=groupsOf(Object.assign({},v,{group:m}),base);
    if(!v.ptall&&(m==='tag'||m==='moc'||m.indexOf('cp:')===0))cols=cols.filter(c=>c.items.length);
    return cols;
  }
  const cols=ks.map(p=>{const s=descend([p.id]);return {key:p.id,label:p.name,items:sortTasks(base.filter(t=>t.projects.some(x=>s.has(x))))}});
  if(f){
    const all=new Set();ks.forEach(p=>descend([p.id]).forEach(x=>all.add(x)));
    const items=sortTasks(base.filter(t=>!t.projects.some(x=>all.has(x))));
    if(items.length||!ks.length)cols.push({key:'',label:ks.length?'Chưa chia vào dự án nhỏ':'Việc của dự án này',items});
  }
  return cols;
}
function filterSummary(v){
  const f=v.f,a=[];
  if(f.scope&&f.scope!=='all')a.push(nm(SCOPES,f.scope));
  if(f.tag.length)a.push('tag: '+f.tag.join(', '));
  if(f.status.length)a.push('trạng thái');
  if(f.star)a.push('★');
  if(f.link)a.push('có liên kết');
  Object.keys(f.cp||{}).forEach(k=>{if((f.cp[k]||[]).length){const p=S.props.find(x=>x.id===k);if(p)a.push(p.name)}});
  return a;
}

function projProg(pid){
  const set=descend([pid]);
  const ts=S.tasks.filter(t=>t.projects.some(x=>set.has(x)));

function isUrgent(t){
  if(t.status==='done')return false;
  const td=todayISO();
  if(eff(t)==='late')return true;
  if(t.due&&t.due.iso<=addDays(td,2))return true;
  return !!(t.work&&t.work.iso<=td);
}
function filtered(v){
  const f=v.f,td=todayISO(),ws=startOfWeek(td),we=endOfWeek(td);
  const pset=f.proj.length?descend(f.proj):null;
  const showDone=v.group==='status'||v.mode==='calendar'||v.mode==='table'||f.scope==='done';
  return S.tasks.filter(t=>{
    if(!showDone&&t.status==='done'){
      if(!(f.scope==='today'&&t.work&&t.work.iso===td&&t.doneAt===td))return false;
    }
    if(pset&&!t.projects.some(x=>pset.has(x)))return false;
    if(f.tag.length&&!t.tags.some(x=>f.tag.includes(x)))return false;
    if(f.status.length&&!f.status.includes(eff(t)))return false;
    if(f.cp){for(const k in f.cp){const sel=f.cp[k];if(!sel||!sel.length)continue;const p=S.props.find(x=>x.id===k);if(!p)continue;const raw=t.custom[k];const val=p.type==='check'?(raw?'1':'0'):(raw==null||raw===''?'∅':String(raw));if(!sel.includes(val))return false}}
    if(f.star&&!t.star)return false;
    if(f.link&&!t.links.length)return false;
    const w=t.work&&t.work.iso,d=t.due&&t.due.iso,late=eff(t)==='late';
    if(f.scope==='today')return w===td||late||(!w&&d===td);
    if(f.scope==='week')return late||(w&&w>=ws&&w<=we)||(d&&d>=ws&&d<=we);
    if(f.scope==='unplanned')return !w;
    if(f.scope==='late')return late;
    if(f.scope==='done')return t.status==='done';
    return true;
  });
}
function sortTasks(a){
  return a.slice().sort((x,y)=>{
    const wx=x.work?x.work.iso:'9999',wy=y.work?y.work.iso:'9999';
    if(wx!==wy)return wx<wy?-1:1;
    const dx=x.due?x.due.iso:'9999',dy=y.due?y.due.iso:'9999';
    if(dx!==dy)return dx<dy?-1:1;
    return PRI_ORDER.indexOf(x.pri)-PRI_ORDER.indexOf(y.pri);
  });
}
function groupsOf(v,ts){
  const g=v.group;
  if(g==='none')return [{key:'',label:'',items:sortTasks(ts)}];
  let keys=[];
  const add=(k,l)=>keys.push({key:k,label:l,items:[]});
  if(g==='status'){statOrder().forEach(k=>add(k,STAT[k]))}
  else if(g==='project'){const set=v.f.proj.length?descend(v.f.proj):null;S.projects.forEach(p=>{if(!set||set.has(p.id))add(p.id,(p.parent?'↳ ':'')+p.name)})}
  else if(g==='tag'){S.tags.forEach(k=>add(k,k));add('','Chưa gắn tag')}
  else if(g==='pri'){priOrder().forEach(k=>add(k,PRI[k]))}
  else if(g.indexOf('cp:')===0){const p=S.props.find(x=>x.id===g.slice(3));if(p){p.opts.forEach(o=>add(o,o));add('','Chưa chọn')}}
  else if(g==='moc'){S.mocs.forEach(k=>add(k,k));add('','Chưa chọn mốc')}
  else if(g==='day'){
    const td=todayISO(),we=endOfWeek(td);
    add('late','Cần dời lại');
    for(let d=td;d<=we;d=addDays(d,1))add(d,d===td?'Hôm nay':fmtD(d));
    add('none','Chưa có ngày làm');
  }
  ts.forEach(t=>{
    let ks=[];
    if(g==='status')ks=[eff(t)];
    else if(g==='project')ks=t.projects;
    else if(g==='tag')ks=t.tags.length?t.tags:[''];
    else if(g==='pri')ks=[t.pri];
    else if(g.indexOf('cp:')===0)ks=[t.custom[g.slice(3)]||''];
    else if(g==='moc')ks=[t.moc||''];
    else if(g==='day'){const td=todayISO();ks=[eff(t)==='late'?'late':!t.work?'none':t.work.iso>=td?t.work.iso:'late']}
    ks.forEach(k=>{const o=keys.find(x=>x.key===k);if(o)o.items.push(t)});
  });
  keys.forEach(k=>k.items=sortTasks(k.items));
  return keys.filter(k=>k.items.length||g==='status'||g==='project'||(g==='moc'&&k.key)||(v.mode==='board'&&g!=='day'&&k.key));
}
function setGroupValue(t,g,k){
  if(g==='status'){if(k==='late')return;t.status=k;if(k==='done')markDone(t,true)}
  else if(g==='project')t.projects=[k||pfocus(curView())||'p0'];
  else if(g==='tag')t.tags=k?[k]:[];
  else if(g==='pri')t.pri=k;
  else if(g==='moc')t.moc=k;
  else if(g.indexOf('cp:')===0)t.custom[g.slice(3)]=k;
  else if(g==='day'){if(k==='none')t.work=null;else if(k!=='late')t.work={iso:k,label:fmtD(k)}}
}
function markDone(t,on){
  if(on){
    t.status='done';t.doneAt=todayISO();
    if(t.repeat&&t.work){
      const step={daily:1,weekly:7,monthly:30}[t.repeat]||0;
      if(step){
        const c=JSON.parse(JSON.stringify(t));
        c.id=uid();c.status='idea';delete c.doneAt;
        const base=t.work.iso<todayISO()?todayISO():t.work.iso;
        c.work={iso:addDays(base,step),label:fmtD(addDays(base,step))};
        if(t.due)c.due={iso:addDays(t.due.iso,step),label:fmtD(addDays(t.due.iso,step)),time:t.due.time};
        S.tasks.push(c);
      }
    }
    if(S.auto.parentDone&&t.parent){
      const p=T(t.parent);
      if(p&&kids(p.id).every(x=>x.status==='done')&&p.status!=='done')markDone(p,true);
    }
  }else{t.status='idea';delete t.doneAt}
}
function delTask(id){
  kids(id).forEach(k=>delTask(k.id));
  S.tasks=S.tasks.filter(t=>t.id!==id);
  S.tasks.forEach(t=>{t.links=t.links.filter(x=>x!==id)});
}

const priOrder=()=>S.priOrder&&S.priOrder.length===4?S.priOrder:PRI_ORDER;
const statOrder=()=>S.statOrder&&S.statOrder.length===4?S.statOrder:['idea','doing','late','done'];
function applyOrder(g,keys){
  const sub=(arr,idf,ks)=>{const set=new Set(ks),idx=[],map=new Map();arr.forEach((x,i)=>{map.set(idf(x),x);if(set.has(idf(x)))idx.push(i)});const items=ks.filter(k=>map.has(k)).map(k=>map.get(k));idx.forEach((pos,n)=>{arr[pos]=items[n]})};
  if(g==='project')sub(S.projects,p=>p.id,keys);
  else if(g==='tag')sub(S.tags,x=>x,keys);
  else if(g==='moc')sub(S.mocs,x=>x,keys);
  else if(g==='pri'){const a=priOrder().slice();sub(a,x=>x,keys);S.priOrder=a}
  else if(g==='status'){const a=statOrder().slice();sub(a,x=>x,keys);S.statOrder=a}
  else if(g.indexOf('cp:')===0){const p=S.props.find(x=>x.id===g.slice(3));if(p)sub(p.opts,x=>x,keys)}
}

const SCOPES=[['all','Tất cả'],['today','Hôm nay'],['week','Tuần này'],['unplanned','Chưa lên lịch'],['late','Đang trì hoãn'],['done','Đã xong']];

function metaHtml(t){
  const e=eff(t),p=[];
  if(e==='late')p.push('<span class="pill late">Trì hoãn</span>');
  else if(e==='doing')p.push('<span class="pill doing">Đang làm</span>');
  if(t.work)p.push('<span>'+esc(t.work.label)+'</span>');
  if(t.moc)p.push('<span>'+esc(t.moc)+'</span>');
  if(t.start)p.push('<span>'+esc(t.start)+(t.end?'–'+esc(t.end):'')+'</span>');
  if(t.est)p.push('<span>'+fmtEst(t.est)+'</span>');
  if(t.due&&e!=='done'){const k=countdown(t.due);p.push('<span class="pill due'+(k.neg?' late':k.soon?' soon':'')+'" data-due="'+esc(t.due.iso+'|'+(t.due.time||''))+'">⏳ '+esc(t.due.label)+' · '+k.txt+'</span>')}
  const pr=prog(t);if(pr)p.push('<span>'+pr.d+'/'+pr.n+' việc con</span>');
  if(t.links.length)p.push('<span>🔗 '+t.links.length+'</span>');
  t.tags.slice(0,2).forEach(x=>p.push('<span class="pill">'+esc(x)+'</span>'));
  return p.join('');
}

  $('#sub').textContent=['calendar','matrix','table'].includes(v.mode)?ts.length+' việc':(v.f.scope==='today'&&mins?'Hôm nay xếp khoảng '+fmtEst(mins)+(mins>360?' — hơi nhiều, thử dời bớt?':''):open.length+' việc đang mở');

function ghHtml(g,v,pb,o){
  o=o||{};
  const isP=v.group==='project'&&g.key;
  const title=isP&&o.drill?'<span class="gt" data-pf="'+g.key+'">'+esc(g.label)+' ›</span>'
    :isP?'<span data-proj="'+g.key+'" style="cursor:pointer;color:var(--ink)">'+esc(g.label)+' ›</span>':'<span class="gt">'+esc(g.label)+'</span>';

  const body=gs.map(c=>{

function cellHtml(t,k){

let sh=null,popState=null,showAll=false;

const addInput=ph=>'<input type="text" class="pin" data-pi="add" placeholder="'+esc(ph)+'">';

function pickSingle(title,opts,cur,cb,o){
  o=o||{};
  popState={on:i=>{if(i==='clr')cb('');else cb(opts[+i][0]);popClose()},add:v=>{o.addFn(v);popClose()}};
  openPop('<div class="ph2">'+esc(title)+'</div>'+opts.map((x,i)=>'<div class="po'+(x[0]===cur?' on':'')+'" data-po="'+i+'">'+esc(x[1])+'</div>').join('')+(o.clear?'<div class="po mut" data-po="clr">'+esc(o.clear)+'</div>':'')+(o.add?addInput(o.add):''));
}
function pickMulti(title,opts,sel,cb,o){
  o=o||{};
  const st=sel.slice();
  const draw=()=>openPop('<div class="ph2">'+esc(title)+'</div>'+opts.map((x,i)=>'<div class="po'+(st.includes(x[0])?' on':'')+'" data-po="'+i+'">'+esc(x[1])+'</div>').join('')+(o.add?addInput(o.add):'')+'<div style="padding:8px 4px 0"><button class="btn" data-po="ok" style="width:100%">Xong</button></div>');
  popState={on:i=>{if(i==='ok'){popClose();return}tog(st,opts[+i][0]);cb(st.slice());draw()},add:v=>{o.addFn(v);opts.push([v,v]);st.push(v);cb(st.slice());draw()}};
  draw();
}
function pickDate(title,cur,cb,withTime){
  popState={
    on:i=>{
      if(i==='clr'){cb(null);return popClose()}
      let d;
      if(i==='rel'){const n=parseInt(val2('pn'),10);if(!(n>0))return;d=presetDate('rel',n,val2('pu'))}
      else d=presetDate(PRESETS[+i][0]);
      d.time=cur&&cur.time||'';cb(d);popClose();
    },
    chg:el=>{
      if(el.dataset.pi==='date'){if(el.value)cb({iso:el.value,label:fmtD(el.value),time:cur&&cur.time||''});else cb(null);popClose()}
      else if(el.dataset.pi==='time'&&cur){cb(Object.assign({},cur,{time:el.value}));popClose()}
    }
  };

   +'<div class="two" style="padding:6px 10px"><input type="number" min="1" data-pi="pn" placeholder="Số" style="width:30%"><select data-pi="pu" style="width:38%"><option value="d">ngày nữa</option><option value="w">tuần nữa</option></select><button class="btn g" data-po="rel">Đặt</button></div>'
   +'<div class="two" style="padding:6px 10px"><input type="date" data-pi="date" value="'+(cur?cur.iso:'')+'">'+(withTime?'<input type="time" data-pi="time" value="'+esc(cur&&cur.time||'')+'" title="Giờ chót (tuỳ chọn)">':'')+'</div>'
   +'<div class="po mut" data-po="clr">Bỏ ngày</div>');

const val2=n=>{const e=document.querySelector('[data-pi='+n+']');return e?e.value:''};

function openPicker(id,key){
  const t=T(id);if(!t)return;
  if(key==='status')return pickSingle('Trạng thái',[['idea','Ý tưởng'],['doing','Đang làm'],['done','Xong']],t.status,v=>{if(v==='done')markDone(t,true);else{t.status=v;delete t.doneAt}});
  if(key==='proj')return pickMulti('Dự án (chọn được nhiều)',projOpts(),t.projects,a=>{t.projects=a.length?a:['p0']});
  if(key==='tag')return pickMulti('Tag',S.tags.map(x=>[x,x]),t.tags,a=>{t.tags=a},{add:'+ tag mới rồi Enter',addFn:v=>{if(!S.tags.includes(v))S.tags.push(v)}});
  if(key==='pri')return pickSingle('Mức ưu tiên',priOrder().map(x=>[x,PRI[x]]),t.pri,v=>{t.pri=v});
  if(key==='moc')return pickSingle('Mốc thời điểm làm',S.mocs.map(x=>[x,x]),t.moc,v=>{t.moc=v},{clear:'Bỏ mốc',add:'+ mốc mới (vd: Sau cà phê) rồi Enter',addFn:v=>{if(!S.mocs.includes(v))S.mocs.push(v);t.moc=v}});
  if(key==='rep')return pickSingle('Lặp lại',[['','Không lặp'],['daily','Hằng ngày'],['weekly','Hằng tuần'],['monthly','Hằng tháng']],t.repeat,v=>{t.repeat=v});
  if(key==='work')return pickDate('Ngày làm',t.work,d=>{t.work=d});
  if(key==='due')return pickDate('Hạn chót',t.due,d=>{t.due=d},true);
  if(key==='star'){t.star=!t.star;save();return refreshSheet()}
  if(key==='links')return pickSingle('Liên kết với việc',S.tasks.filter(x=>x.id!==t.id&&!t.links.includes(x.id)).map(x=>[x.id,(x.icon||'')+' '+x.name+'  ('+x.projects.map(i=>(P(i)||{}).name).join(', ')+')']),'',v=>{if(v){const o=T(v);t.links.push(o.id);o.links.push(t.id)}});
  if(key==='time'){
    popState={chg:el=>{t[el.dataset.pi]=el.value;save()},on:()=>popClose()};
    return openPop('<div class="ph2">Giờ bắt đầu / kết thúc</div><div class="two" style="padding:6px 10px"><input type="time" data-pi="start" value="'+esc(t.start)+'"><input type="time" data-pi="end" value="'+esc(t.end)+'"></div><div style="padding:8px 4px 0"><button class="btn" data-po="ok" style="width:100%">Xong</button></div>');
  }
  if(key==='est'){
    const unit=t.est>=480&&t.est%480===0?'d':t.est>=60&&t.est%60===0?'h':'m';
    const num=unit==='d'?t.est/480:unit==='h'?t.est/60:t.est;
    popState={chg:()=>{const n=parseFloat(val2('en'))||0,u=val2('eu');t.est=Math.round(n*(u==='d'?480:u==='h'?60:1));save()},on:()=>popClose()};
    return openPop('<div class="ph2">Thời gian ước tính</div><div class="two" style="padding:6px 10px"><input type="number" min="0" data-pi="en" value="'+(num||'')+'" placeholder="25"><select data-pi="eu"><option value="m"'+(unit==='m'?' selected':'')+'>phút</option><option value="h"'+(unit==='h'?' selected':'')+'>giờ</option><option value="d"'+(unit==='d'?' selected':'')+'>ngày</option></select></div><div style="padding:8px 4px 0"><button class="btn" data-po="ok" style="width:100%">Xong</button></div>');
  }
  if(key.indexOf('cp:')===0){
    const p=S.props.find(x=>x.id===key.slice(3));if(!p)return;
    if(p.type==='check'){t.custom[p.id]=!t.custom[p.id];save();return refreshSheet()}
    if(p.type==='select')return pickSingle(p.name,p.opts.map(o=>[o,o]),t.custom[p.id],v=>{t.custom[p.id]=v},{clear:'Bỏ chọn'});
    popState={chg:el=>{t.custom[p.id]=p.type==='number'?(el.value===''?'':+el.value):el.value;save()},on:()=>popClose()};
    return openPop('<div class="ph2">'+esc(p.name)+'</div><div style="padding:6px 10px"><input type="'+(p.type==='number'?'number':'text')+'" data-pi="cv" value="'+esc(t.custom[p.id]==null?'':t.custom[p.id])+'"></div><div style="padding:8px 4px 0"><button class="btn" data-po="ok" style="width:100%">Xong</button></div>');
  }
}

const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
function parseLine(line){
  const o={};let s=line;
  s=s.replace(/#(\S+)/g,(m,x)=>{const p=S.projects.find(p=>norm(p.name).replace(/\s/g,'').startsWith(norm(x)));if(p)o.proj=p.id;return p?'':m});
  s=s.replace(/@(\S+)/g,(m,x)=>{const k={homnay:'today',nay:'today',mai:'tmr',tuan:'week',tuannay:'week',tuansau:'nweek'}[norm(x)];if(k){o.work=presetDate(k);return ''}return m});
  s=s.replace(/~(\d+)([pgd]?)/g,(m,n,u)=>{o.est=+n*(u==='g'?60:u==='d'?480:1);return ''});
  s=s.replace(/(^|\s)!(\s|$)/g,()=>{o.star=true;return ' '});
  o.name=s.replace(/\s+/g,' ').trim();
  return o;
}

// ----- Lịch timetable (tuần / ngày / tháng) -----
const HH=52,HW=72;
const tmin=s=>{const a=s.split(':');return (+a[0])*60+(+a[1]||0)};
const wdi=iso=>(fromISO(iso).getDay()+6)%7;
function calCfg(v){if(!v.cal)v.cal={type:'week',orient:'v',collapsed:[]};return v.cal}
function dayItems(ts,day){
  const timed=[],all=[],dues=[];
  ts.forEach(t=>{
    if(t.work&&t.work.iso===day){
      if(t.start){const s=tmin(t.start);let e=t.end?tmin(t.end):s+Math.max(t.est||30,20);if(e<=s)e=s+30;timed.push({t,s,e})}
      else all.push(t);
    }else if(t.due&&t.due.iso===day&&t.status!=='done')dues.push(t);
  });
  return {timed,all,dues};
}
function assignLanes(items){
  items.sort((a,b)=>a.s-b.s||a.e-b.e);
  const ends=[];
  items.forEach(it=>{let l=0;while(ends[l]!==undefined&&ends[l]>it.s)l++;ends[l]=it.e;it.l=l});
  const n=Math.max(1,ends.length);items.forEach(it=>it.n=n);return n;
}
function blkLabel(t){return (t.icon?esc(t.icon)+' ':'')+esc(t.name||'Chưa đặt tên')}
function chipRow(it){return it.all.map(t=>'<div class="ac'+(t.status==='done'?' dn':'')+'" data-open="'+t.id+'">'+blkLabel(t)+'</div>').join('')+it.dues.map(t=>'<div class="ac due" data-open="'+t.id+'">⏳ '+blkLabel(t)+'</div>').join('')}
function dayHead(d,c,horiz){
  const td=todayISO(),col=c.type==='week'&&c.collapsed.includes(wdi(d)),dt=fromISO(d);
  const lab='<span data-goday="'+d+'">'+DOW[dt.getDay()]+' <b>'+dt.getDate()+'</b></span>';
  if(c.type==='day')return '<div class="dh'+(d===td?' td':'')+'">'+lab+'</div>';
  return '<div class="dh'+(d===td?' td':'')+(col?' col':'')+'">'+(col?'':lab)+(col?'<span class="mini">'+dt.getDate()+'</span>':'')+'<button data-colt="'+wdi(d)+'" title="Đóng/mở cột">'+(col?'›':(horiz?'▴':'▾'))+'</button></div>';
}
function calHtml(v,ts){
  const c=calCfg(v),td=todayISO();
  if(!calSel)calSel=td;
  const days=c.type==='day'?[calSel]:[0,1,2,3,4,5,6].map(i=>addDays(startOfWeek(calSel),i));
  const lab=c.type==='month'?'Tháng '+(fromISO(calSel).getMonth()+1)+'/'+fromISO(calSel).getFullYear():c.type==='day'?fmtD(calSel):fmtD(days[0])+' – '+fmtD(days[6]);
  let h='<div class="calbar"><div class="two"><button class="ib" data-cn="-1">‹</button><button class="chip" data-cn="0">Hôm nay</button><button class="ib" data-cn="1">›</button><b class="cl">'+lab+'</b></div><div class="two" style="margin-top:6px;flex-wrap:wrap">'
   +[['day','Ngày'],['week','Tuần'],['month','Tháng']].map(x=>'<button class="chip'+(c.type===x[0]?' on':'')+'" data-ct="'+x[0]+'">'+x[1]+'</button>').join('')
   +(c.type!=='month'?'<button class="chip" data-co="1">'+(c.orient==='v'?'⇅ Dọc':'⇆ Ngang')+'</button>':'')
   +(c.type==='week'?'<button class="chip" data-colall="1">'+(c.collapsed.length?'Mở hết cột':'Thu gọn cột')+'</button>':'')
   +'</div></div>';
  if(c.type==='month')return h+monthHtml(ts);
  const data=days.map(d=>dayItems(ts,d));
  let lo=7,hi=22;
  data.forEach(x=>x.timed.forEach(i=>{lo=Math.min(lo,Math.floor(i.s/60));hi=Math.max(hi,Math.min(24,Math.ceil(i.e/60)))}));
  data.forEach(x=>{x.n=assignLanes(x.timed)});
  return h+(c.orient==='v'?ttVert(c,days,data,lo,hi):ttHoriz(c,days,data,lo,hi));
}
function ttVert(c,days,data,lo,hi){
  const td=todayISO(),now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const isCol=d=>c.type==='week'&&c.collapsed.includes(wdi(d));
  const cols=days.map(d=>isCol(d)?'30px':(c.type==='day'?'1fr':'minmax(92px,1fr)'));
  let h='<div class="tg" style="grid-template-columns:34px '+cols.join(' ')+'"><div class="gut hd"></div>'+days.map(d=>dayHead(d,c,false)).join('');
  h+='<div class="gut al">cả ngày</div>'+days.map((d,i)=>'<div class="al">'+(isCol(d)?((data[i].all.length+data[i].dues.length)?'<span class="dot"></span>':''):chipRow(data[i]))+'</div>').join('');
  let hl='';for(let k=lo;k<hi;k++)hl+='<div class="hl" style="height:'+HH+'px">'+pad(k)+'</div>';
  h+='<div class="gut">'+hl+'</div>';
  days.forEach((d,i)=>{
    if(isCol(d)){h+='<div class="dc cl" style="height:'+(hi-lo)*HH+'px"></div>';return}
    let cells='';for(let k=lo;k<hi;k++)cells+='<div class="hc" data-slot="'+d+'|'+k+'" style="height:'+HH+'px"></div>';
    const blk=data[i].timed.map(it=>'<div class="blk '+eff(it.t)+'" data-open="'+it.t.id+'" style="top:'+((it.s-lo*60)/60*HH)+'px;height:'+Math.max((it.e-it.s)/60*HH-2,22)+'px;left:'+(it.l*100/it.n)+'%;width:calc('+(100/it.n)+'% - 2px)">'+blkLabel(it.t)+'<small>'+esc(it.t.start)+'</small></div>').join('');
    const nl=d===td&&nm>=lo*60&&nm<=hi*60?'<div class="nowl" style="top:'+((nm-lo*60)/60*HH)+'px"></div>':'';
    h+='<div class="dc" style="height:'+(hi-lo)*HH+'px">'+cells+blk+nl+'</div>';
  });
  return h+'</div>';
}
function ttHoriz(c,days,data,lo,hi){
  const td=todayISO(),now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const w=(hi-lo)*HW;
  let hh='';for(let k=lo;k<hi;k++)hh+='<div style="width:'+HW+'px">'+pad(k)+'</div>';
  let h='<div class="hg" style="width:'+(70+w)+'px"><div class="hrow hhead"><div class="gut hlab"></div><div class="hhrs">'+hh+'</div></div>';
  days.forEach((d,i)=>{
    const col=c.type==='week'&&c.collapsed.includes(wdi(d));
    if(col){h+='<div class="hrow" style="height:30px"><div class="gut hlab">'+dayHead(d,c,true)+'</div><div class="hb" style="width:'+w+'px;height:30px">'+((data[i].all.length+data[i].dues.length+data[i].timed.length)?'<span class="dot" style="margin:12px"></span>':'')+'</div></div>';return}
    const strip=(data[i].all.length+data[i].dues.length)?30:0,H=strip+data[i].n*32+8;
    let cells='';for(let k=lo;k<hi;k++)cells+='<div class="hcx" data-slot="'+d+'|'+k+'" style="left:'+((k-lo)*HW)+'px;width:'+HW+'px"></div>';
    const blk=data[i].timed.map(it=>'<div class="blk '+eff(it.t)+'" data-open="'+it.t.id+'" style="left:'+((it.s-lo*60)/60*HW)+'px;width:'+Math.max((it.e-it.s)/60*HW-2,48)+'px;top:'+(strip+4+it.l*32)+'px;height:28px">'+blkLabel(it.t)+'</div>').join('');
    const nl=d===td&&nm>=lo*60&&nm<=hi*60?'<div class="nowh" style="left:'+((nm-lo*60)/60*HW)+'px"></div>':'';

  });

}
function monthHtml(ts){
  const td=todayISO(),sd=fromISO(calSel),y=sd.getFullYear(),mo=sd.getMonth()+1;
  const startPad=new Date(y,mo-1,1).getDay(),days=new Date(y,mo,0).getDate();
  const byDay={};
  ts.forEach(t=>{[t.work&&['w',t.work.iso],t.due&&['d',t.due.iso]].forEach(x=>{if(x){(byDay[x[1]]=byDay[x[1]]||[]).push([x[0],t])}})});
  let h='<div class="cal">'+DOW.map(d=>'<div class="h">'+d+'</div>').join('');
  for(let i=0;i<startPad;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const s=y+'-'+pad(mo)+'-'+pad(d),items=byDay[s]||[];
    h+='<button class="cd'+(s===td?' td':'')+(s===calSel?' sel':'')+'" data-day="'+s+'">'+d+'<br>'+items.slice(0,4).map(x=>'<span class="dot'+(x[0]==='d'?' d':'')+'"></span>').join('')+'</button>';
  }
  h+='</div><div class="gh">'+fmtD(calSel)+' <span class="n">● ngày làm · ○ hạn chót</span></div>';
  const items=byDay[calSel]||[];
  h+=items.length?items.map(x=>(x[0]==='d'?'<div class="par" style="margin:6px 8px 0">⏳ Hạn chót</div>':'')+rowHtml(x[1])).join(''):'<div class="empty">Ngày này trống</div>';
  return h;
}

function beginColDrag(col,e){
  if(!col||DG)return;
  const cont=col.parentElement,axis=cont.dataset.dragc||'x';
  DG={col,cont,axis,px:e.clientX,py:e.clientY,sc:axis==='x'?cont:$('#main'),raf:0};
  col.classList.add('dragging');
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(x){}
  colLoop();
}
function colMove(){
  const {col,cont,axis}=DG;
  const kids=[...cont.children].filter(k=>k.dataset&&k.dataset.gk!==undefined);
  const p=axis==='x'?DG.px:DG.py,ci=kids.indexOf(col);
  for(let i=0;i<kids.length;i++){
    const k=kids[i];if(k===col)continue;
    const r=k.getBoundingClientRect(),mid=axis==='x'?r.left+r.width/2:r.top+r.height/2;
    if(i>ci&&p>mid){cont.insertBefore(col,k.nextSibling);break}
    if(i<ci&&p<mid){cont.insertBefore(col,k);break}
  }
}
function colLoop(){
  if(!DG)return;
  const sc=DG.sc,r=sc.getBoundingClientRect();
  if(DG.axis==='x'){if(DG.px<r.left+50)sc.scrollLeft-=14;else if(DG.px>r.right-50)sc.scrollLeft+=14}
  else{if(DG.py<r.top+70)sc.scrollTop-=14;else if(DG.py>r.bottom-70)sc.scrollTop+=14}
  colMove();
  DG.raf=requestAnimationFrame(colLoop);
}
function endColDrag(){
  if(!DG)return;
  cancelAnimationFrame(DG.raf);
  const keys=[...DG.cont.children].map(k=>k.dataset&&k.dataset.gk).filter(k=>k);
  DG.col.classList.remove('dragging');

}

  [LPc,TDt].forEach(s=>{if(s){s.x=e.clientX;s.y=e.clientY;if(Math.abs(e.clientX-s.sx)>8||Math.abs(e.clientY-s.sy)>8){clearTimeout(s.t);if(s===LPc)LPc=null;if(s===TDt)TDt=null}}});
  if(DG){DG.px=e.clientX;DG.py=e.clientY}
  if(TD){TD.px=e.clientX;TD.py=e.clientY}
});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{
  if(LPc){clearTimeout(LPc.t);LPc=null}
  if(TDt){clearTimeout(TDt.t);TDt=null}
  if(DG)endColDrag();
  if(TD)endTabDrag();
}));

// ----- Kéo thả thẻ việc giữa các cột board -----
function cdBegin(row,st){
  const col=row.closest('[data-gk]');if(!col||CD)return;
  const r=row.getBoundingClientRect(),gh=row.cloneNode(true);
  gh.classList.add('cdghost');
  gh.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;pointer-events:none;z-index:60;opacity:.93;box-shadow:0 10px 26px rgba(0,0,0,.6);background:var(--s2);border:1px solid var(--pink);border-radius:10px;margin:0';
  document.body.appendChild(gh);row.classList.add('dragging');
  CD={row,gh,id:row.dataset.id,src:col.dataset.gk,ox:st.x-r.left,oy:st.y-r.top,px:st.x,py:st.y,hot:null,raf:0,bd:row.closest('.board')};
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(x){}
  cdLoop();
}
function cdLoop(){
  if(!CD)return;
  CD.gh.style.left=(CD.px-CD.ox)+'px';CD.gh.style.top=(CD.py-CD.oy)+'px';
  const el=document.elementFromPoint(CD.px,CD.py),col=el&&el.closest?el.closest('[data-gk]'):null;
  const hot=col&&col.closest('.board,.vboard')?col:null;
  if(hot!==CD.hot){if(CD.hot)CD.hot.classList.remove('drop');CD.hot=hot;if(hot&&hot.dataset.gk!==CD.src)hot.classList.add('drop')}
  const m=$('#main'),mr=m.getBoundingClientRect();
  if(CD.py<mr.top+70)m.scrollTop-=14;else if(CD.py>mr.bottom-70)m.scrollTop+=14;
  if(CD.bd){const br=CD.bd.getBoundingClientRect();if(CD.px<br.left+50)CD.bd.scrollLeft-=14;else if(CD.px>br.right-50)CD.bd.scrollLeft+=14}
  CD.raf=requestAnimationFrame(cdLoop);
}
function cdEnd(){
  if(!CD)return;
  cancelAnimationFrame(CD.raf);
  const {gh,row,id,src,hot}=CD;
  gh.remove();row.classList.remove('dragging');if(hot)hot.classList.remove('drop');
  CD=null;swallowClick();
  if(!hot)return;
  const key=hot.dataset.gk;if(key===src)return;
  const v=curView(),g=colGroup(v),t=T(id);if(!t)return;
  if(g==='project'){
    const pc=pfocus(v),rm=src?descend([src]):new Set(pc?[pc]:[]),nk=key||pc;
    t.projects=t.projects.filter(x=>!rm.has(x));
    if(nk&&!t.projects.includes(nk))t.projects.push(nk);
    if(!t.projects.length)t.projects=['p0'];
  }else if(g==='tag'){
    t.tags=t.tags.filter(x=>x!==src);
    if(key&&!t.tags.includes(key))t.tags.push(key);
  }else setGroupValue(t,g,key);
  save();render();
}
document.addEventListener('pointerdown',e=>{
  if(e.button>0||DG||TD)return;
  const row=e.target.closest('.board .row,.vboard .row');
  if(!row||e.target.closest('button'))return;
  clearTimeout(CDt&&CDt.t);const st={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};CDt=st;
  st.t=setTimeout(()=>{if(CDt!==st)return;CDt=null;cdBegin(row,st)},420);
});
document.addEventListener('pointermove',e=>{
  if(CDt){CDt.x=e.clientX;CDt.y=e.clientY;if(Math.abs(e.clientX-CDt.sx)>8||Math.abs(e.clientY-CDt.sy)>8){clearTimeout(CDt.t);CDt=null}}
  if(CD){CD.px=e.clientX;CD.py=e.clientY}
});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{
  if(CDt){clearTimeout(CDt.t);CDt=null}
  if(CD)cdEnd();
}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.board .row,.vboard .row,#fab'))e.preventDefault()});
let FBt=null;
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#fab'))return;
  clearTimeout(FBt);FBt=setTimeout(()=>{FBt=null;swallowClick();if(navigator.vibrate)try{navigator.vibrate(15)}catch(x){}quickSheet()},550);
});
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,()=>{if(FBt){clearTimeout(FBt);FBt=null}}));
$('#bar').addEventListener('contextmenu',e=>e.preventDefault());
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),450)}},1100);
load().then(()=>{
  render();
  try{const go=new URLSearchParams(location.search).get('go'),m={today:'v1',week:'v2',cal:'v3',proj:'v4'};
    if(go==='add')quickSheet();
    else if(m[go]&&S.views.find(v=>v.id===m[go])){S.active=m[go];render();if(m[go]!==S.views[0].id)pushLayer('tab')}}catch(x){}
  setInterval(tickCountdown,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sh)render()});
});
// ----- Bản offline: sao lưu, lưu bền, service worker -----
(function(){
  NAV=true;try{history.replaceState({gtd:0},'')}catch(e){}
  window.addEventListener('popstate',function(e){const n=(e.state&&e.state.gtd)||0;while(layers.length>n){layerClose(layers.pop())}});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}

  window.OFFLINE=true;
  // ----- Thông báo (chạy khi app đang mở hoặc vừa dùng) -----
  function notify(title,body,tag){
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(r){r.showNotification(title,{body:body,tag:tag,icon:'icon-192.png',badge:'icon-192.png'})})}
      else new Notification(title,{body:body,icon:'icon-192.png'});
    }catch(e){}
  }
  function checkNotify(){
    if(!S||!S.noti||!S.noti.on||typeof Notification==='undefined'||Notification.permission!=='granted')return;
    const now=new Date(),td=todayISO(),nm=now.getHours()*60+now.getMinutes();
    const sent=S.noti.sent=S.noti.sent||{};
    if(Object.keys(sent).length>400)S.noti.sent={};
    const fire=function(k,t,b){if(S.noti.sent[k])return;S.noti.sent[k]=1;notify(t,b,k);save()};
    S.tasks.forEach(function(t){
      if(t.status==='done')return;
      if(S.noti.start&&t.work&&t.work.iso===td&&t.start){const s=tmin(t.start);if(nm>=s-10&&nm<s+30)fire('s|'+t.id+'|'+td,'Sắp đến giờ: '+t.name,t.start+(t.est?' · '+fmtEst(t.est):''))}
      if(S.noti.due&&t.due){
        const ms=new Date(t.due.iso+'T'+(t.due.time||'23:59')+':00')-now;
        if(ms>36e5&&ms<=864e5)fire('d1|'+t.id+'|'+t.due.iso,'Còn dưới 1 ngày: '+t.name,t.due.label);
        if(ms>0&&ms<=36e5)fire('d2|'+t.id+'|'+t.due.iso,'Còn dưới 1 giờ: '+t.name,t.due.label);
      }
    });
    if(S.noti.late&&nm>=480&&nm<720){const n=S.tasks.filter(function(t){return eff(t)==='late'}).length;if(n)fire('l|'+td,'Có '+n+' việc cần dời lịch','Mở app để dời sang ngày khác')}
  }
  setInterval(checkNotify,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)checkNotify()});
  setTimeout(checkNotify,3000);
  // ----- Xuất file .ics để Lịch của điện thoại nhắc -----
  const icsEsc=function(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')};
  const hm=function(m){return pad(Math.floor(m/60)%24)+pad(m%60)+'00'};
  const alarm=function(min,txt){return 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEsc(txt)+'\r\nTRIGGER:-PT'+min+'M\r\nEND:VALARM\r\n'};
  function buildICS(t){
    const ev=[],stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const add=function(day,s,e,title,alarms){
      ev.push('BEGIN:VEVENT\r\nUID:'+t.id+'-'+ev.length+'@gtd\r\nDTSTAMP:'+stamp+'\r\nDTSTART:'+day.replace(/-/g,'')+'T'+hm(s)+'\r\nDTEND:'+day.replace(/-/g,'')+'T'+hm(e)+'\r\nSUMMARY:'+icsEsc(title)+'\r\nDESCRIPTION:'+icsEsc(t.note)+'\r\n'+alarms.map(function(a){return alarm(a,title)}).join('')+'END:VEVENT\r\n');
    };
    if(t.work){const s=t.start?tmin(t.start):540;let e=t.end?tmin(t.end):s+Math.max(t.est||30,15);if(e<=s)e=s+30;if(e>1439)e=1439;add(t.work.iso,s,e,t.name,[10])}
    if(t.due){const s=t.due.time?tmin(t.due.time):540;add(t.due.iso,s,Math.min(s+30,1439),'Hạn chót: '+t.name,[1440,60])}
    return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GTD//VI\r\nCALSCALE:GREGORIAN\r\n'+ev.join('')+'END:VCALENDAR\r\n';
  }
  document.addEventListener('click',function(e){
    const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='ics'&&sh&&sh.type==='task'){
      const t=T(sh.id);if(!t)return;
      const blob=new Blob([buildICS(t)],{type:'text/calendar'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nhac-viec.ics';document.body.appendChild(a);a.click();a.remove();
    }
    if(b.dataset.a==='noton'){
      if(S.noti.on){S.noti.on=false;save();settingsSheet(true);return}
      if(typeof Notification==='undefined'){return}
      Notification.requestPermission().then(function(p){
        if(p==='granted'){S.noti.on=true;save();notify('Get Thing Done','Đã bật thông báo','test');}
        if(sh&&sh.type==='set')settingsSheet(true);
      });
    }
    if(b.dataset.a==='notopt'){S.noti[b.dataset.v]=!S.noti[b.dataset.v];save();settingsSheet(true)}
  });
  const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.style.display='none';document.body.appendChild(f);
  document.addEventListener('click',function(e){
    const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='export'){
      const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mot-viec-'+todayISO()+'.json';
      document.body.appendChild(a);a.click();a.remove();
    }
    if(b.dataset.a==='import')f.click();
  });
  f.addEventListener('change',function(){
    const file=f.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=function(){
      try{
        const d=JSON.parse(r.result);
        if(!d||!d.tasks||!d.views||!d.projects)throw new Error('bad');
        S=d;if(!S.views.find(v=>v.id===S.active))S.active=S.views[0].id;
        save();closeSheet();
      }catch(x){const s=document.getElementById('sub');if(s)s.textContent='File sao lưu không đúng định dạng'}
      f.value='';
    };
    r.readAsText(file);
  });
})();
</script>
